name: Bug report / Signaler un bug
description: Something does not work as it should. / Quelque chose ne marche pas comme prévu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! French or English, both are fine. / Merci ! En français ou en anglais.
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings > About / Paramètres > À propos
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine
      description: Where Polydock runs, e.g. Synology DS920+, Unraid, Raspberry Pi 5, Docker Desktop on Windows, desktop app on macOS 15. / Où tourne Polydock.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / Navigateur
      placeholder: Firefox 133 on Windows 11
  - type: textarea
    id: steps
    attributes:
      label: What happened / Ce qui s'est passé
      description: What you did, what you expected, what you got instead. / Ce que tu as fait, ce que tu attendais, ce que tu as eu.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Journaux
      description: The output of `docker logs polydock` around the problem, or the desktop app's File > Show the log. / La sortie de `docker logs polydock`, ou Fichier > Afficher le journal dans l'application de bureau.
      render: text
  - type: markdown
    attributes:
      value: |
        Screenshots help too: drop them in the box above. Please do not share files you do not own. / Les captures aident aussi. Ne partage pas de fichiers dont tu n'as pas les droits.
